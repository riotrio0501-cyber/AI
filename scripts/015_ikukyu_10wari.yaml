title: 育休の手取りが10割相当になる制度
length: short
targets: [30〜40代]
season: null
info_year: 2025年4月からの制度（2026年時点）
status: draft
age_note: null

sources:
  - label: 厚生労働省 母性健康管理サイト「出生後休業支援給付」
    url: https://www.bosei-navi.mhlw.go.jp/glossary/provide08.html
    note: 休業開始時賃金日額×支給対象日数（上限28日）×13%
  - label: 厚生労働省「出生後休業支援給付 簡易診断」
    url: https://www.mhlw.go.jp/stf/syussyougo_kanishindan_00001.html
