id: "008"
title: 初ボーナスの手取りが思ったより少ない理由
length: short
targets: [新社会人, 季節]
season: 12
info_year: 2026年分（令和8年分）
status: draft
age_note: null

sources:
  - label: 国税庁 タックスアンサー No.2523「賞与に対する源泉徴収」
    url: https://www.nta.go.jp/taxes/shiraberu/taxanswer/gensen/2523.htm
    note: 前月の社会保険料等控除後の給与と扶養親族等の数で率が決まる
  - label: 国税庁「賞与に対する源泉徴収税額の算出率の表（令和8年分）」
    url: https://www.nta.go.jp/publication/pamph/gensen/zeigakuhyo2026/data/15-16.pdf
    note: 賞与の所得税の率
  - label: 日本年金機構「賞与にかかる保険料」
    url: https://www.nenkin.go.jp/service/kounen/hokenryo/hoshu/20141203.html
    note: 賞与からも厚生年金・健康保険料がかかる（要確認：環境の制限で本文未取得、URLも要確認）

scenes:
  - role: hook
    telop: "初ボーナス、\n[[約2割]]引かれるって知ってた？"
    narration: 初ボーナス、額面から約2割も引かれるって知ってた？
    visual: {type: icon, name: wallet}
    check: 要確認  # 目安。社会保険料（約15%）＋所得税で概ね2割前後。人により異なる
  - role: point
    telop: "引かれるのは\nこの[[4つ]]"
    narration: 引かれるのは、健康保険、厚生年金、雇用保険、そして所得税の4つ。
    visual: {type: steps, items: [健康保険料, 厚生年金保険料, 雇用保険料, 所得税]}
  - role: point
    telop: "30万円なら\n手取り[[約24万円]]"
    narration: 例えば30万円のボーナスなら、手取りは24万円くらいが目安です。
    visual: {type: bar, items: [{label: 額面, value: 30, text: 30万円}, {label: 手取り, value: 24, text: 約24万円, highlight: true}]}
    check: 要確認  # 40歳未満・扶養なし・月給20万円前後を想定した概算
  - role: point
    telop: "でも[[住民税]]は\n引かれない"
    narration: ちなみに住民税は、ボーナスからは引かれないのが一般的。
    visual: {type: icon, name: check}
  - role: caution
    telop: "所得税の率は\n[[人によって違う]]"
    narration: ただし所得税の率は、前の月の給料や、扶養している人の数で変わります。
    visual: {type: icons, items: [{name: wallet, label: 前月の給料}, {name: family, label: 扶養の人数}]}
  - role: caution
    telop: "使う前に\n[[賞与明細]]をチェック"
    narration: 使う前に、賞与明細で、何がいくら引かれたかチェックしてね。
    visual: {type: icon, name: document, text: 賞与明細}
  - role: outro
    telop: "[[保存]]して見返してね"
    narration: 保存して見返してね。フォローすると、毎日お得な情報が届くよ。

caption_title: 【初ボーナス】手取りが思ったより少ない理由｜引かれる4つのお金
question: 初ボーナス、何に使う予定？コメントで教えて👇
caption: |
  ボーナスからは、健康保険・厚生年金・雇用保険の保険料と所得税が引かれます。
  住民税は毎月の給料から引かれるので、ボーナスからは引かれないのが一般的。
  所得税の率は前月の給料や扶養の人数で変わるので、賞与明細で確認してね。
  ※2026年分の情報です。金額は目安で、会社や加入している健康保険によって変わります。出典：国税庁・日本年金機構
hashtags: [ボーナス, 新社会人, 手取り, 冬のボーナス, お金の知識]
