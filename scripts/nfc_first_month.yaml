# ショート動画 台本ファイル
# このファイルを差し替える（コピーして書き換える）だけで別の動画が作れる。
#
# 書き方:
#   narration : 読み上げる文（読みが怪しい語は "reading" で上書き可）
#   captions  : 画面のテロップ。1枚=1画面、10〜15文字目安。
#               [ ] で囲んだ部分がアクセント色、{ } で囲んだ部分が警告色になる。
#               1シーンに複数枚あれば、ナレーションの長さに合わせて均等に切り替える。
#   label     : 画面上部の小見出し（任意）
#   min_sec   : シーンの最短秒数（任意）

meta:
  title: "NFC口コミカード、最初の1ヶ月で売れた数"
  output: out/nfc_first_month.mp4
  theme: dark_blue        # 背景グラデーションのプリセット
  voice_speed: 1.2       # 読み上げ速度
  bgm: lofi_pad           # 自作シンセBGM（著作権フリー）

scenes:
  - id: hook
    narration: "売れたのは、たった3枚。"
    captions:
      - "1ヶ月で売れたのは{3枚}"   # 0秒目から数字を見せる
    min_sec: 1.5

  - id: intro
    narration: "NFC口コミカードで、ひとり起業。ぶっちゃけ失敗談です。"
    captions:
      - "NFC口コミカード"
      - "ひとり起業の[失敗談]"

  - id: fail1
    label: "失敗①"
    narration: "失敗その1。誰に売るか決める前に、カードを100枚つくった。"
    captions:
      - "売り先を決める前に"
      - "{100枚}つくった"

  - id: fail2
    label: "失敗②"
    narration: "失敗その2。NFCの仕組みばかり説明した。店長が知りたいのは、口コミが増えるかだけ。"
    captions:
      - "NFCの仕組みを熱弁"
      - "店長が知りたいのは"
      - "[口コミが増えるか]だけ"

  - id: fail3
    label: "失敗③"
    narration: "失敗その3。お店にDMを50件送って、返信はゼロ。"
    captions:
      - "お店にDMを50件"
      - "返信は{0件}"

  - id: lesson
    label: "学んだこと"
    narration: "学んだのは、売る前に1店舗で結果を出すこと。無料で置いたら、2週間で口コミが12件増えた。その数字が、最強の営業資料になった。"
    captions:
      - "売る前に[1店舗]で"
      - "結果を出す"
      - "2週間で口コミ[+12件]"
      - "数字が最強の[営業資料]"

  - id: cta
    narration: "保存して、見返してね。"
    captions:
      - "[保存]して見返してね"
    min_sec: 2.0
