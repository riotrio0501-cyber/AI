  - role: point
    telop: "申請書は\n[[1月10日]]必着"
    narration: 寄附先が5つ以内なら、申請書を翌年1月10日までに届ければ、確定申告はいりません。
    visual: {type: steps, items: [寄附先が5自治体以内, 確定申告しない会社員など, 申請書は1月10日必着]}
  - role: caution
    telop: "[[上限]]を超えると\nただの寄附に"
    narration: ただし、上限額を超えた分は自己負担になるので、先に目安をチェックしてね。
    visual: {type: icon, name: warning}
  - role: outro
    telop: "[[保存]]して見返してね"
    narration: 保存して見返してね。フォローすると、毎日お得な情報が届くよ。

caption_title: 【ふるさと納税】今年分は12月31日まで｜ワンストップ特例の期限も
question: 今年はもう寄附した？コメントで教えて👇
caption: |
  ふるさと納税は1月〜12月の寄附がその年の分。今年分は12月31日までです。
  確定申告をしない会社員で寄附先が5自治体以内なら、ワンストップ特例（翌年1月10日必着）が使えます。
  上限額は収入や家族構成で変わるので、先に確認してね。
  ※2026年分の情報です。出典：総務省・各自治体
hashtags: [ふるさと納税, ワンストップ特例, 会社員, 年末, お金の知識]
