id: "002"
title: バイト学生の「年収の壁」が変わった
length: short
targets: [学生・若者]
season: 11
info_year: 2025年分（令和7年分）以降の所得税
status: draft
age_note: null

sources:
  - label: 国税庁「令和7年度税制改正による所得税の基礎控除の見直し等について」
    url: https://www.nta.go.jp/users/gensen/2025kiso/index.htm
    note: 基礎控除・給与所得控除の見直し、特定親族特別控除の創設（要確認：環境の制限で本文未取得）
  - label: 財務省「令和7年度税制改正」
    url: https://www.mof.go.jp/tax_policy/tax_reform/outline/fy2025/index.html
    note: いわゆる103万円の壁の見直し（要確認）

scenes:
  - role: hook
    telop: "バイト学生、\n[[103万の壁]]はもう古い"
    narration: バイトしてる学生さん、103万円の壁って、もう古いかも。
    visual: {type: icon, name: student}
  - role: point
    telop: "自分の所得税は\n年収[[160万円]]まで0円"
    narration: 2025年分から、自分に所得税がかからないラインは、年収160万円まで上がりました。
    visual: {type: compare, before: 103万円, after: 160万円, before_label: これまで, after_label: 2025年分から}
    check: 要確認  # 基礎控除の特例（合計所得132万円以下）を含めた金額。国税庁で確認
  - role: point
    telop: "親の控除も\n[[150万円]]までは満額"
    narration: さらに19歳から22歳なら、年収150万円までは、親の控除も満額のまま。
    visual: {type: icon, name: family, caption: "[[19〜22歳]]の子が対象"}
    check: 要確認  # 特定親族特別控除。63万円満額の上限が給与収入150万円か要確認
  - role: caution
    telop: "[[住民税]]や[[社会保険]]は\n別の壁があるよ"
    narration: ただし、住民税や、親の健康保険の扶養は、別のラインがあるので注意。
    visual: {type: icon, name: warning}
  - role: caution
    telop: "働く前に\n[[親と勤務先]]に確認"
    narration: シフトを増やす前に、親と勤務先に確認してね。
    visual: {type: icons, items: [{name: family, label: 親}, {name: building, text: 職場, label: 勤務先}]}
  - role: outro
    telop: "[[保存]]して見返してね"
    narration: 保存して見返してね。フォローすると、毎日お得な情報が届くよ。

caption: |
  「103万円を超えたらダメ」はもう古いかも。
  2025年分から、所得税の壁が大きく変わりました。
  ただし住民税や健康保険の扶養は別のラインがあるので、シフトを増やす前に親・勤務先に確認してね。
  ※2025年分以降の所得税の情報です。出典：国税庁・財務省
hashtags: [大学生, バイト, 年収の壁, 103万円の壁, 扶養, お金の知識, 知らなきゃ損, 学生, 節約]
