prefecture: 長野県
code: 20
color:
  main: '#4E9F55'
  dark: '#0B1F0D'
  note: 信州の山の緑
hook:
  narration: 長野県民なら、全部わかる。
  captions:
  - '[長野県民]なら/{全部}わかる'
facts:
- title: 信濃の国
  photo:
    emoji: 🎵
  narration: その1。長野県民は、県歌の信濃の国が歌える。学校で何度も歌うので、県外に出てからも歌える人が多いという説。
  reading: その1。長野県民は、けんかの、しなののくにが歌える。学校で何度も歌うので、県外に出てからも歌える人が多いという説。
  captions:
  - ①県歌[信濃の国]が/歌える
  - 学校で{何度も}歌う
  - 県外でも歌える/という{説}
  status: 説
  evidence:
  - url: https://ja.wikipedia.org/wiki/信濃の国
    memo: 1968年に県歌に制定。県内の小中学校で広く歌われ、県民の歌唱率が高いとされる（調査ではなく通説のため「説」）。
- title: 牛乳パン
  photo:
    emoji: 🍞
  narration: その2。長野のパン屋さんでおなじみ、牛乳パン。ふわふわの生地に、クリームがたっぷり。袋の男の子の絵も定番。
  reading: その2。長野のパン屋さんでおなじみ、ぎゅうにゅうパン。ふわふわの生地に、クリームがたっぷり。袋の男の子の絵も定番。
  captions:
  - ②おなじみの/[牛乳パン]
  - '{クリーム}たっぷり'
  - 袋の{男の子}の絵
  status: ok
  evidence:
  - url: https://ja.wikipedia.org/wiki/牛乳パン
    memo: 長野県内の多くのパン店で売られるご当地パン。袋に男の子のイラストが描かれたものが多い。
- title: 長野と松本
  photo:
    emoji: 🏯
  narration: その3。県庁があるのは長野市。でも、松本も負けていない。長野と松本は、ずっとライバル関係という説。
  reading: その3。県庁があるのは長野市。でも、まつもとも負けていない。長野とまつもとは、ずっとライバル関係という説。
  captions:
  - ③県庁は/[長野]市
  - でも{松本}も/負けてない
  - ずっと{ライバル}？
  status: 説
  evidence:
  - url: https://ja.wikipedia.org/wiki/筑摩県
    memo: 明治に北の長野県と南の筑摩県（松本）が合併した経緯があり、両市の対抗意識がよく語られる（通説のため「説」）。
comment_question: 長野派？松本派？
outro:
  narration: あなたは、長野派？松本派？あなたの県のあるあるも、コメントで教えて。
  reading: あなたは、長野派？まつもと派？あなたの県のあるあるも、コメントで教えて。
  captions:
  - '[長野]派？/[松本]派？'
  - あなたの県も/[コメント]で教えて
