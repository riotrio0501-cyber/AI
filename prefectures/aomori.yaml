prefecture: 青森県
code: 2
color:
  main: "#E03A3E"
  dark: "#2A0709"
  note: "りんごの赤"

hook:
  narration: "青森県民なら、全部わかる。"
  captions:
    - "[青森県民]なら/{全部}わかる"

facts:
  - title: "おでんに生姜味噌"
    narration: "その1。青森のおでんは、生姜味噌をたっぷりかける。寒い駅前で、連絡船を待つ人を温めたのが始まり。"
    captions:
      - "①おでんに[生姜味噌]"
      - "からしじゃなく/{生姜味噌}をかける"
      - "連絡船の客を/温めたのが始まり"
    status: ok
    evidence:
      - url: https://www.city.aomori.aomori.jp/_res/projects/default_project/_page_/001/009/900/04_p4_tokushu2_oden.pdf
        memo: "青森市広報資料。青森駅前の屋台の女将が、冬に青函連絡船や列車を待つ人を温めようと、すりおろし生姜入り味噌をおでんにかけたのが始まり。"

  - title: "味噌カレー牛乳ラーメン"
    narration: "その2。味噌、カレー、牛乳。全部入ったラーメンが、青森ではちゃんと人気。意外とまろやかで、うまい。"
    captions:
      - "②味噌×カレー×牛乳"
      - "[全部入りラーメン]が/ちゃんと人気"
      - "意外と{まろやか}"
    status: 要確認
    evidence:
      - url: https://intojapanwaraku.com/lifestyle/290188/
        memo: "二次資料。昭和50年代に中高生の間で生まれたとされ、青森市内の複数店で提供。店舗数・由来は青森市や店舗の公式情報で要確認。「うまい」は感想表現。"

  - title: "イギリストースト"
    narration: "その3。青森のソウルフードといえば、工藤パンのイギリストースト。甘いマーガリンをはさんだ食パンで、県民はみんな食べて育つ。"
    reading: "その3。青森のソウルフードといえば、くどうパンのイギリストースト。甘いマーガリンをはさんだ食パンで、県民はみんな食べて育つ。"
    captions:
      - "③[イギリストースト]"
      - "甘いマーガリンを/はさんだ食パン"
      - "県民は{これで育つ}"
    status: ok
    evidence:
      - url: https://nlab.itmedia.co.jp/research/articles/3802126/
        memo: "工藤パン（青森市）のロングセラー菓子パン。グラニュー糖入りマーガリンを山型食パンでサンド。1966〜67年頃発売（資料により差があるため年は動画で言わない）。"
      - url: https://www.athome.co.jp/vox/jtown/all/39659/
        memo: "二次資料（青森のソウルフードとして紹介）。「みんな食べて育つ」は演出上の表現。"

outro:
  narration: "あなたの県のあるあるも、コメントで教えて。"
  captions:
    - "あなたの県も"
    - "[コメント]で教えて"
