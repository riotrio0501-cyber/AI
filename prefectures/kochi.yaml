facts:
- title: カツオのたたき
  post: カツオのたたきは塩で食べる
  photo:
    emoji: 🐟
  narration: その1。高知のカツオのたたきは、わらで焼いて、塩で食べる。カツオにお金を使う額は、高知市が日本一の常連。
  reading: その1。高知のカツオのたたきは、わらで焼いて、しおで食べる。カツオにお金を使う額は、高知市が日本一の常連。
  captions:
  - ①[カツオのたたき]は/{塩}で食べる
  - '{わら}で焼く'
  - カツオの支出は/[日本一]の常連
  status: ok
  evidence:
  - url: https://www.stat.go.jp/data/kakei/
    memo: 総務省「家計調査」のかつお購入数量・金額で高知市は1位の常連。わら焼き・塩たたきは高知の名物として知られる（タレで食べる店も多い）。
- title: べく杯
  post: 置けない杯「べく杯」で飲む
  photo:
    emoji: 🍶
  narration: その2。高知の宴会には、べく杯がある。底に穴があいていたり、丸かったりして、飲み干すまで置けない杯。
  reading: その2。高知の宴会には、べくはいがある。底に穴があいていたり、丸かったりして、飲み干すまで置けない杯。
  captions:
  - ②宴会には/[べく杯]
  - 底に{穴}があいてる
  - 飲み干すまで/{置けない}
  status: ok
  evidence:
  - url: https://ja.wikipedia.org/wiki/可杯
    memo: 可杯（べくはい）は穴があいていたり、底が丸く自立しなかったりして、飲み干すまで置けない杯。高知の酒席文化として知られる。
- title: 日曜市
  post: 300年以上続く日曜市
  photo:
    emoji: 🧺
  narration: その3。高知の日曜市は、300年以上続く街路市。毎週日曜、1キロ以上にわたって、およそ300のお店が並ぶ。
  reading: その3。高知のにちようしは、300年以上続くがいろいち。毎週日曜、1キロ以上にわたって、およそ300のお店が並ぶ。
  captions:
  - ③[日曜市]は/{300年以上}続く
  - 毎週日曜/{約300店}が並ぶ
  status: ok
  evidence:
  - url: https://ja.wikipedia.org/wiki/日曜市
    memo: 元禄3年（1690年）から続くとされる高知市の街路市。追手筋に約1.3kmにわたり約300店が並ぶ（高知市資料）。
