prefecture: 富山県
code: 16
color:
  main: '#2C7FB8'
  dark: '#071A2A'
  note: 立山と富山湾の青
hook:
  narration: 富山県民なら、全部わかる。
  captions:
  - '[富山県民]なら/{全部}わかる'
facts:
- title: 持ち家率
  photo:
    emoji: 🏠
  narration: その1。富山は、持ち家率が全国トップクラス。家も広くて、延べ床面積も全国上位の常連。
  reading: その1。富山は、もちいえ率が全国トップクラス。家も広くて、のべゆか面積も全国上位の常連。
  captions:
  - ①[持ち家率]が/全国{トップクラス}
  - 家も{広い}
  status: ok
  evidence:
  - url: https://www.stat.go.jp/data/jyutaku/
    memo: 総務省「住宅・土地統計調査」で持ち家率・1住宅あたり延べ面積とも全国上位の常連（年により順位は変動するため「トップクラス」）。
- title: 富山ブラック
  photo:
    emoji: 🍜
  narration: その2。富山ブラックは、真っ黒なスープのラーメン。しょっぱいけど、ご飯と食べると最高、という声も。
  reading: その2。とやまブラックは、真っ黒なスープのラーメン。しょっぱいけど、ご飯と食べると最高、という声も。
  captions:
  - ②[富山ブラック]は
  - '{真っ黒}なスープ'
  - '{ご飯}と食べると/最高？'
  status: ok
  evidence:
  - url: https://ja.wikipedia.org/wiki/富山ブラックラーメン
    memo: 戦後、富山市の「大喜」で肉体労働者向けに塩分の濃いスープを出したのが始まりとされる。
- title: 昆布
  photo:
    emoji: 🍙
  narration: その3。昆布はとれないのに、富山は昆布好き。昆布じめ、昆布おにぎり。北前船で運ばれてきた名残という説。
  reading: その3。こんぶはとれないのに、富山はこんぶ好き。こぶじめ、こんぶおにぎり。きたまえぶねで運ばれてきた名残という説。
  captions:
  - ③昆布はとれないのに/[昆布好き]
  - '{昆布じめ}/{昆布おにぎり}'
  - '[北前船]の名残/という説'
  status: 説
  evidence:
  - url: https://www.stat.go.jp/data/kakei/
    memo: 総務省「家計調査」で富山市の昆布購入額は全国トップクラス。北前船の寄港地として昆布文化が根づいたとされる（説）。
comment_question: 富山ブラック、ご飯いる派？いらない派？
outro:
  narration: 富山ブラック、ご飯いる派？いらない派？あなたの県のあるあるも、コメントで教えて。
  reading: とやまブラック、ご飯いる派？いらない派？あなたの県のあるあるも、コメントで教えて。
  captions:
  - 富山ブラック/[ご飯]いる派？
  - あなたの県も/[コメント]で教えて
