facts:
- title: 蛇口からみかんジュース
  post: 蛇口からみかんジュースが出る？
  photo:
    emoji: 🍊
  narration: その1。愛媛では、蛇口からみかんジュースが出る。家の蛇口は都市伝説。でも、空港には本当にある。
  reading: その1。愛媛では、じゃぐちからみかんジュースが出る。家のじゃぐちは都市伝説。でも、空港には本当にある。
  captions:
  - ①[蛇口]から/{みかんジュース}
  - 家の蛇口は/{都市伝説}
  - でも[空港]には/本当にある
  status: ok
  evidence:
  - url: https://ja.wikipedia.org/wiki/みかんジュース
    memo: 「愛媛の蛇口からはポンジュースが出る」は都市伝説として知られる。松山空港などに実際にみかんジュースが出る蛇口が設置されている。
- title: じゃこ天
  post: おやつにもなる、じゃこ天
  photo: assets/photos/ehime/jakoten.jpg
  narration: その2。宇和島のじゃこ天は、小魚を骨ごとすりつぶして揚げたもの。おかずにも、おやつにもなる。
  reading: その2。うわじまのじゃこてんは、小魚を骨ごとすりつぶして揚げたもの。おかずにも、おやつにもなる。
  captions:
  - ②宇和島の/[じゃこ天]
  - 小魚を{骨ごと}/すりつぶす
  - '{おやつ}にもなる'
  status: ok
  evidence:
  - url: https://ja.wikipedia.org/wiki/じゃこ天
    memo: 愛媛県南予地方の郷土料理。ホタルジャコ等の小魚を骨・皮ごとすり身にして揚げる。
- title: 鯛めし
  post: 鯛めしは2種類ある
  photo: assets/photos/ehime/taimeshi.jpg
  narration: その3。愛媛の鯛めしは2種類。炊き込みご飯の鯛めしと、生の鯛を、卵入りのタレでご飯にかける、宇和島の鯛めし。
  reading: その3。愛媛のたいめしは2種類。炊き込みご飯のたいめしと、生のたいを、卵入りのタレでご飯にかける、うわじまのたいめし。
  captions:
  - ③[鯛めし]は/{2種類}
  - '{炊き込み}の鯛めし'
  - 生の鯛をかける/[宇和島]の鯛めし
  status: ok
  evidence:
  - url: https://ja.wikipedia.org/wiki/鯛めし
    memo: 中予・東予では鯛を炊き込む鯛めし、南予（宇和島）では生の鯛の刺身を卵入りのタレとともにご飯にかける鯛めしが食べられる。
comment_question: 鯛めし、炊き込み派？宇和島派？
outro:
  narration: 鯛めしは、炊き込み派？宇和島派？あなたの県のあるあるも、コメントで教えて。
  reading: たいめしは、炊き込み派？うわじま派？あなたの県のあるあるも、コメントで教えて。
  captions:
  - 鯛めしは/{炊き込み}派？[宇和島]派？
  - あなたの県も/[コメント]で教えて
