prefecture: 福島県
code: 7
color:
  main: "#14A6A8"
  dark: "#03211F"
  note: "猪苗代湖の青緑"

hook:
  narration: "福島県民なら、全部わかる。"
  captions:
    - "[福島県民]なら/{全部}わかる"

facts:
  - title: "3つの地方で別世界"
    narration: "その1。福島は、会津、中通り、浜通りで、まるで別の県。冬、会津は大雪なのに、浜通りは晴れてることもある。"
    reading: "その1。福島は、あいづ、なかどおり、はまどおりで、まるで別の県。冬、あいづは大雪なのに、はまどおりは晴れてることもある。"
    captions:
      - "①会津・中通り・浜通り"
      - "まるで[別の県]"
      - "会津は大雪でも/浜通りは{晴れ}"
    status: ok
    evidence:
      - url: https://www.data.jma.go.jp/fukushima/kikou/kikou.html
        memo: "福島地方気象台。奥羽山脈と阿武隈高地で気候が分かれ、会津は日本海側、浜通りは太平洋側、中通りは中間。冬型では会津は雪、浜通り平地は晴天が多い。「別の県」は演出上の表現。"
      - url: https://www.pref.fukushima.lg.jp/download/1/kouho_kyoudo007.pdf
        memo: "福島県資料。3地方の気候の違い。"

  - title: "喜多方の朝ラー"
    narration: "その2。喜多方では、朝からラーメンを食べる。その名も朝ラー。夜勤明けの人のため、という説もある。"
    captions:
      - "②喜多方は/[朝からラーメン]"
      - "その名も{朝ラー}"
      - "夜勤明けの人のため/という{説}も"
    status: 説
    evidence:
      - url: https://rurubu.jp/andmore/article/10421
        memo: "二次資料。喜多方の朝ラー文化。坂内食堂（1958年創業）は昭和40年ごろから朝営業。由来は夜勤明けの工場勤務者・早朝の農作業後など諸説。動画では由来を「説」として紹介。"

  - title: "郡山のクリームボックス"
    narration: "その3。郡山のパン屋には、たいていクリームボックスがある。厚い食パンに、白いミルククリーム。県外だと、まず見かけない。"
    captions:
      - "③郡山のパン屋には"
      - "[クリームボックス]"
      - "県外では/{まず見かけない}"
    status: ok
    evidence:
      - url: https://tabelog.com/matome/20239/
        memo: "二次資料。厚めの食パンにミルククリームを塗った郡山の名物パン。市内の多くのパン屋で販売。元祖はベーカリー・ロミオとされる（2024年に休業報道があり、動画では触れない）。"
      - url: https://en.wikipedia.org/wiki/Cream_Box
        memo: "概要。「県外ではまず見かけない」は演出上の表現。"

comment_question: "朝ラー、アリ？ナシ？"

outro:
  narration: "朝からラーメン、アリ？ナシ？あなたの県のあるあるも、コメントで教えて。"
  captions:
    - "[朝ラー]/{アリ？ナシ？}"
    - "あなたの県も/[コメント]で教えて"
