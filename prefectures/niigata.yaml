prefecture: 新潟県
code: 15
color:
  main: '#3E8FD0'
  dark: '#08182A'
  note: 日本海の青
hook:
  narration: 新潟県民なら、全部わかる。
  captions:
  - '[新潟県民]なら/{全部}わかる'
facts:
- title: 柿の種
  photo:
    emoji: 🥜
  narration: その1。おつまみの定番、柿の種。実は新潟・長岡生まれ。お米の県は、おせんべいの県でもある。
  reading: その1。おつまみの定番、かきのたね。実は新潟、ながおか生まれ。お米の県は、おせんべいの県でもある。
  captions:
  - ①おつまみの定番/[柿の種]
  - 実は{新潟}・[長岡]生まれ
  - お米の県は/{米菓}の県
  status: ok
  evidence:
  - url: https://ja.wikipedia.org/wiki/柿の種
    memo: 大正末期に長岡の浪花屋製菓が考案したとされる。新潟県は米菓の出荷額が全国1位（業界統計）。
- title: イタリアン
  photo:
    emoji: 🍝
  narration: その2。新潟でイタリアンといえば、焼きそばに、ミートソースをかけた食べもの。フォークで食べるのが新潟流。
  captions:
  - ②新潟で[イタリアン]と/いえば
  - '{焼きそば}に/[ミートソース]'
  - フォークで食べる
  status: ok
  evidence:
  - url: https://ja.wikipedia.org/wiki/イタリアン_(料理)
    memo: 新潟市の「みかづき」、長岡市の「フレンド」で提供される焼きそば料理。
- title: 何地方？
  photo:
    emoji: 🗾
  narration: その3。新潟って何地方？中部、北陸、甲信越、ときには東北。資料によって変わるので、県民も迷う。
  reading: その3。新潟って何地方？ちゅうぶ、ほくりく、こうしんえつ、ときには東北。資料によって変わるので、県民も迷う。
  captions:
  - ③新潟って/[何地方]？
  - '{中部}？{北陸}？/{甲信越}？'
  - 資料で変わるから/[県民も迷う]
  status: ok
  evidence:
  - url: https://ja.wikipedia.org/wiki/中部地方
    memo: 学校教育の8地方区分では中部地方。気象庁は北陸、NHK等は甲信越、東北電力の供給区域など東北扱いの例もある。「県民も迷う」は演出。
comment_question: 新潟は何地方だと思う？
outro:
  narration: 新潟は、何地方だと思う？あなたの県のあるあるも、コメントで教えて。
  captions:
  - 新潟は/[何地方]だと思う？
  - あなたの県も/[コメント]で教えて
