prefecture: 熊本県
code: 43
color:
  main: "#3FA34D"
  dark: "#08200C"
  note: "阿蘇の草原の緑"

hook:
  narration: "熊本県民なら、全部わかる。"
  captions:
    - "[熊本県民]なら/{全部}わかる"

facts:
  - title: "水道水は100%地下水"
    photo: assets/photos/kumamoto/suizenji.jpg
    narration: "その1。熊本市の水道水は、100パーセント地下水。ダムの水を使っていない。蛇口から、天然水が出てくる。"
    captions:
      - "①水道水は/[100%地下水]"
      - "ダムの水を/{使っていない}"
      - "蛇口から[天然水]"
    status: ok
    evidence:
      - url: https://www.city.kumamoto.jp/kankyo/kiji00320463/index.html
        memo: "熊本市。市民の水道水の100%を地下水で賄う。1924年の通水開始以来100%地下水で、ダムや浄水場がない。「蛇口から天然水」は演出上の表現。"

  - title: "あとぜき"
    photo: {emoji: "🚪"}
    narration: "その2。熊本では、あとぜき。開けたら閉めてね、という意味の熊本弁。好きな熊本弁の1位にもなった。"
    reading: "その2。熊本では、あとぜき。開けたら閉めてね、という意味の熊本弁。好きな熊本弁の、いちいにもなった。"
    captions:
      - "②ドアには/[あとぜき]"
      - "意味は/{開けたら閉める}"
      - "好きな熊本弁/[1位]"
    status: ok
    evidence:
      - url: https://www.kumanichi.com/articles/15762
        memo: "熊本日日新聞。熊本弁検定アンケートで好きな熊本弁1位が「あとぜき」（ドア・ふすま等を開けたあとに閉めること）。"
      - url: https://www.kumanichi.com/articles/1234331
        memo: "後世に残したい熊本弁でも1位。"

  - title: "太平燕"
    photo: assets/photos/kumamoto/taipien.jpg
    narration: "その3。熊本のちゃんぽん的存在、太平燕。春雨のスープに、揚げ卵。給食にも出てくるのに、県外ではほぼ知られていない。"
    reading: "その3。熊本のちゃんぽん的存在、タイピーエン。春雨のスープに、揚げ卵。給食にも出てくるのに、県外ではほぼ知られていない。"
    captions:
      - "③[太平燕]"
      - "春雨スープに/{揚げ卵}"
      - "県外では/{ほぼ無名}"
    status: 説
    evidence:
      - url: https://kumamoto-guide.jp/spots/detail/257
        memo: "熊本県観光サイト。春雨を使ったスープに揚げ卵などをのせる熊本の中華料理。中国福建省の料理が華僑により伝わったとされる。"
      - url: https://serai.jp/gourmet/1219086
        memo: "二次資料。学校給食にも登場する県民食。「県外ではほぼ無名」は演出上の表現なので「説」。"

comment_question: "あとぜき、通じる？"

outro:
  narration: "あとぜき、あなたの地元でも通じる？あなたの県のあるあるも、コメントで教えて。"
  captions:
    - "[あとぜき]/通じる？"
    - "あなたの県も/[コメント]で教えて"
