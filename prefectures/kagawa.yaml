facts:
- title: うどん
  post: うどんへの支出は日本一の常連
  photo: assets/photos/kagawa/udon.jpg
  narration: その1。香川県民は、うどんにお金を使う額が、日本一の常連。朝ごはんにも、お昼にも。うどんは毎日の食べもの。
  captions:
  - ①うどんへの支出は/[日本一]の常連
  - '{朝ごはん}にも/うどん'
  status: ok
  evidence:
  - url: https://www.stat.go.jp/data/kakei/
    memo: 総務省「家計調査」の生うどん・そば支出で高松市は全国1位の常連。「朝ごはんにも」は県民の声として紹介される（演出）。
- title: 骨付鳥
  post: 丸亀の骨付鳥、おや派？ひな派？
  photo: assets/photos/kagawa/honetsuki.jpg
  narration: その2。丸亀の骨付鳥は、かための親鳥と、やわらかいひな鳥の2種類。どっちを頼むかで、好みが分かれる。
  reading: その2。まるがめのほねつきどりは、かための、おやどりと、やわらかい、ひなどりの2種類。どっちを頼むかで、好みが分かれる。
  captions:
  - ②丸亀の[骨付鳥]
  - かための{おや}/やわらかい{ひな}
  - 好みが[分かれる]
  status: ok
  evidence:
  - url: https://ja.wikipedia.org/wiki/骨付鳥
    memo: 丸亀市の「一鶴」が発祥とされ、親鶏（おや）と若鶏（ひな）の2種類がある。
- title: いちばん小さい県
  post: 日本でいちばん小さい県
  photo:
    emoji: 🗾
  narration: その3。香川県は、日本でいちばん面積が小さい県。それでも、ため池の数は全国トップクラス。
  reading: その3。香川県は、日本でいちばん面積が小さい県。それでも、ためいけの数は全国トップクラス。
  captions:
  - ③面積は/[日本一小さい]
  - でも{ため池}は/全国トップクラス
  status: ok
  evidence:
  - url: https://ja.wikipedia.org/wiki/香川県
    memo: 面積約1,877km²で全国最小。ため池の数は約1万2千で、密度は全国1位、数も全国上位（農林水産省 ため池データベース）。
