prefecture: 岩手県
code: 3
color:
  main: "#2FA36B"
  dark: "#062014"
  note: "岩手の森と山の緑"

hook:
  narration: "岩手県民なら、全部わかる。"
  captions:
    - "[岩手県民]なら/{全部}わかる"

facts:
  - title: "じゃじゃ麺の締め"
    photo:
      - assets/photos/iwate/jajamen.jpg
      - assets/photos/iwate/chitantan.jpg
    narration: "その1。盛岡のじゃじゃ麺は、食べ終わってからが本番。お皿に卵を割って、ゆで汁を入れてもらう。これが、ちいたんたん。"
    reading: "その1。盛岡のじゃじゃめんは、食べ終わってからが本番。お皿に卵を割って、ゆで汁を入れてもらう。これが、ちいたんたん。"
    captions:
      - "①じゃじゃ麺は/[食べ終わってから]"
      - "卵を割って/ゆで汁を注ぐ"
      - "その名も/{ちいたんたん}"
    status: 説
    evidence:
      - url: https://ascii.jp/elem/000/004/355/4355976/
        memo: "二次資料。盛岡じゃじゃ麺の店でちーたん（ちいたんたん）を追加で頼むのが定番。作り方は店により異なる（皿に卵を割り、ゆで汁と肉みそを入れるのが一般的とされる）。"

  - title: "福田パン"
    photo: {emoji: "🥪"}
    narration: "その2。盛岡の福田パンは、大きいコッペパンに、好きな具を2種類はさんでもらえる。県民の、ソウルフード。"
    captions:
      - "②[福田パン]"
      - "好きな具を/{2種類}はさむ"
      - "県民の[ソウルフード]"
    status: ok
    evidence:
      - url: https://tabiiro.jp/gourmet/article/moriokashi-gotochi-gourmet/
        memo: "二次資料。1948年創業の盛岡の店。具材を2種類選ぶと目の前でコッペパンに挟んでくれる注文方式。"

  - title: "本州でいちばん広い"
    photo: assets/photos/iwate/iwatesan.jpg
    narration: "その3。岩手県は、本州でいちばん広い県。全国でも、北海道の次に広い。だから県内の移動が、とにかく遠い。"
    captions:
      - "③本州で[いちばん広い]"
      - "全国でも/北海道の次"
      - "県内移動が{とにかく遠い}"
    status: ok
    evidence:
      - url: https://www.pref.okayama.jp/uploaded/attachment/409728.pdf
        memo: "国土地理院「全国都道府県市区町村別面積調」（令和7年10月1日）を引いた岡山県資料。1位北海道83,422.27km²、2位岩手県15,275.05km²。北海道は本州ではないので岩手が本州最大。「移動が遠い」は演出上の表現。"

comment_question: "福田パン、何と何をはさむ派？"

outro:
  narration: "福田パン、何と何をはさむ派？あなたの県のあるあるも、コメントで教えて。"
  captions:
    - "[福田パン]は/何と何をはさむ？"
    - "あなたの県も/[コメント]で教えて"
