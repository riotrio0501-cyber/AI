prefecture: 徳島県
code: 36
color:
  main: '#3A6FC4'
  dark: '#0A1528'
  note: 阿波藍の青
hook:
  narration: 徳島県民なら、全部わかる。
  captions:
  - '[徳島県民]なら/{全部}わかる'
facts:
- title: 電車がない
  post: 徳島には電車が走っていない
  photo: assets/photos/tokushima/train.jpg
  narration: その1。徳島県には、電車が走っていない。線路を走るのは、全部ディーゼルカー。だから、汽車と呼ぶ人も多い。
  reading: その1。徳島県には、でんしゃが走っていない。線路を走るのは、全部ディーゼルカー。だから、きしゃと呼ぶ人も多い。
  captions:
  - ①徳島には/[電車]がない
  - 走るのは全部/{ディーゼルカー}
  - だから/[汽車]と呼ぶ
  status: ok
  evidence:
  - url: https://ja.wikipedia.org/wiki/徳島県
    memo: 県内のJR線は全線非電化で、電化された鉄道が通っていない唯一の都道府県とされる。「汽車」と呼ぶ習慣は県民の声として広く紹介される。
- title: 徳島ラーメン
  post: 徳島ラーメンには生卵
  photo: assets/photos/tokushima/ramen.jpg
  narration: その2。徳島ラーメンは、茶色いスープに、甘辛い豚バラ。そして、生卵をのせるのが徳島流。
  reading: その2。とくしまラーメンは、茶色いスープに、あまからいぶたバラ。そして、なまたまごをのせるのが徳島流。
  captions:
  - ②[徳島ラーメン]は
  - 甘辛い{豚バラ}
  - '{生卵}をのせる'
  status: ok
  evidence:
  - url: https://ja.wikipedia.org/wiki/徳島ラーメン
    memo: 茶系の豚骨醤油スープ、甘辛く煮た豚バラ肉、生卵のトッピングが特徴とされる。
- title: すだち
  post: すだちは何にでもかける
  photo: assets/photos/tokushima/sudachi.jpg
  narration: その3。すだちは、ほぼ全部が徳島産。焼き魚にも、みそ汁にも、ビールにも。なんにでも、しぼってかける。
  reading: その3。すだちは、ほぼ全部が徳島産。焼き魚にも、みそしるにも、ビールにも。なんにでも、しぼってかける。
  captions:
  - ③[すだち]は/ほぼ{徳島産}
  - '{焼き魚}にも/{ビール}にも'
  - '[なんにでも]かける'
  status: ok
  evidence:
  - url: https://ja.wikipedia.org/wiki/スダチ
    memo: すだちの生産量は徳島県が全国の9割以上を占める（農林水産省 特産果樹生産動態等調査）。「なんにでも」は演出。
comment_question: 徳島ラーメン、生卵入れる？
outro:
  narration: 徳島ラーメン、生卵入れる？あなたの県のあるあるも、コメントで教えて。
  reading: とくしまラーメン、なまたまご入れる？あなたの県のあるあるも、コメントで教えて。
  captions:
  - '[徳島ラーメン]/{生卵}入れる？'
  - あなたの県も/[コメント]で教えて
