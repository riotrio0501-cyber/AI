# 「〇〇県民しか知らないこと3選」台本ファイル
# prefectures/ にこの形式のファイルを追加するだけで1本の動画になる。
#
# テロップ記法:  [ ] = アクセント色（県カラー）  { } = 強調色（黄）  / = 改行位置の指定（省略時は自動）
# 1シーンに captions が複数あれば、ナレーションの長さで均等に切り替える。
# reading を書くとナレーションの読みだけを上書きできる（テロップは captions のまま）。
# status: ok / 要確認   ※要確認が1つでも残っていると make 時に警告を出す

prefecture: 山形県
code: 6                      # JIS都道府県コード（シルエット描画に使用）
color:
  main: "#E8792B"            # 紅花（県花）のオレンジ
  dark: "#3A1406"
  note: "県花・紅花のイメージ"

hook:
  narration: "山形県民なら全部わかる。"
  captions:
    - "[山形県民]なら/{全部}わかる"

facts:
  - title: "芋煮は地域で別物"
    narration: "その1。芋煮は地域で別の料理。内陸は牛肉としょうゆ。庄内は豚肉とみそ。どっちが正解かで、本気でもめる。"
    captions:
      - "①芋煮は地域で別物"
      - "内陸は[牛肉×しょうゆ]"
      - "庄内は[豚肉×みそ]"
      - "どっちが正解かで{もめる}"
    status: ok
    evidence:
      - url: https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/imoni.html
        memo: "農水省「うちの郷土料理」。村山・最上は牛肉・醤油、庄内は豚肉・味噌、置賜は牛肉・醤油に味噌を隠し味。"
      - memo: "「本気でもめる」は演出上の表現（毎年のネット上の論争ネタとして定番）。事実主張ではない。"

  - title: "ラーメン支出 日本一"
    narration: "その2。山形市は、外食のラーメンにお金を使う額が日本一。夏は冷たいスープの、冷やしラーメンまである。"
    reading:   # 「山形市」をはっきり読ませたい場合などに使う（今回は不要）
    captions:
      - "②ラーメン支出[日本一]"
      - "外食ラーメン代が/[全国1位]"
      - "夏は{冷やしラーメン}"
    status: 要確認
    evidence:
      - url: https://www.stat.go.jp/data/kakei/5.html
        memo: "総務省 家計調査（品目別・都道府県庁所在市別）。中華そば（外食）支出額で山形市は2022・2023・2024年に1位（2024年は22,389円）。※最新の2025年分が公表済みなら順位を一次資料で要確認。"
      - url: https://toyokeizai.net/articles/-/857435
        memo: "二次資料（報道）。"
      - memo: "冷やしラーメンは山形市の栄屋本店が発祥とされる（店舗の公式情報で要確認）。"

  - title: "県民歌は昭和天皇の歌"
    narration: "その3。山形県民の歌、最上川。歌詞は、昭和天皇が詠んだ和歌。意外と知らない人も多い。"
    reading: "その3。山形県民の歌、もがみがわ。歌詞は、昭和天皇がよんだ和歌。意外と知らない人も多い。"
    captions:
      - "③県民歌は「最上川」"
      - "歌詞は[昭和天皇の和歌]"
      - "{意外と知らない}かも"
    status: ok
    evidence:
      - url: https://www.pref.yamagata.jp/documents/4972/0220tokushu1.pdf
        memo: "山形県資料。1925年に皇太子時代の昭和天皇が山形を訪れ、翌1926年の歌会始で詠んだ御製。1930年作曲、1982年に山形県民の歌に制定。"

outro:
  narration: "あなたの県のあるあるも、コメントで教えて。"
  captions:
    - "あなたの県も"
    - "[コメント]で教えて"
