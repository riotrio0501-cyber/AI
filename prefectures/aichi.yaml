prefecture: 愛知県
code: 23
color:
  main: '#E07B28'
  dark: '#24120A'
  note: 名古屋めしの赤味噌
hook:
  narration: 愛知県民なら、全部わかる。
  captions:
  - '[愛知県民]なら/{全部}わかる'
facts:
- title: 赤味噌
  post: "味噌は赤味噌、冷蔵庫に「つけてみそかけてみそ」"
  photo: assets/photos/aichi/misokatsu.jpg
  narration: その1。愛知の味噌は、赤味噌。味噌カツ、味噌煮込み、どて煮。チューブのつけてみそかけてみそが、冷蔵庫に常備。
  reading: その1。愛知のみそは、あかみそ。みそカツ、みそにこみ、どてに。チューブの、つけてみそかけてみそが、冷蔵庫に常備。
  captions:
  - ①味噌は[赤味噌]
  - '{味噌カツ}{味噌煮込み}'
  - 冷蔵庫に/[つけてみそかけてみそ]
  status: ok
  evidence:
  - url: https://ja.wikipedia.org/wiki/つけてみそかけてみそ
    memo: ナカモが販売するチューブ入りの豆味噌だれ。東海地方の家庭で広く常備される。
- title: 放課
  post: "休み時間のことを「放課」"
  photo: assets/photos/aichi/classroom.jpg
  narration: その2。学校の休み時間のことを、愛知では放課と言う。放課後じゃなくて、放課。県外で通じなくて驚く人も。
  reading: その2。学校の休み時間のことを、愛知では、ほうかと言う。ほうかごじゃなくて、ほうか。県外で通じなくて驚く人も。
  captions:
  - ②休み時間のことを/[放課]
  - 放課後じゃなくて/{放課}
  - 県外では/{通じない}
  status: ok
  evidence:
  - url: https://ja.wikipedia.org/wiki/名古屋弁
    memo: 愛知県などで授業間の休み時間を「放課」と呼ぶ。方言と気づかない人が多いとされる。
- title: 尾張と三河
  post: "尾張と三河はまるで別の国"
  photo: assets/photos/aichi/okazaki.jpg
  narration: その3。愛知は、西の尾張と東の三河で、まるで別の国。言葉も気質もちがう。名古屋と豊橋は、ずっとライバルという説。
  reading: その3。愛知は、西のおわりと東のみかわで、まるで別の国。言葉も気質もちがう。名古屋と豊橋は、ずっとライバルという説。
  captions:
  - ③西の[尾張]と/東の[三河]
  - '{言葉}も{気質}も/ちがう'
  - '{ライバル}という説'
  status: 説
  evidence:
  - url: https://ja.wikipedia.org/wiki/愛知県
    memo: 愛知県は旧尾張国と旧三河国からなる。方言（名古屋弁・三河弁）の違いや対抗意識がよく語られる（通説のため「説」）。
comment_question: 尾張派？三河派？
outro:
  narration: あなたは、尾張派？三河派？あなたの県のあるあるも、コメントで教えて。
  reading: あなたは、おわり派？みかわ派？あなたの県のあるあるも、コメントで教えて。
  captions:
  - '[尾張]派？/[三河]派？'
  - あなたの県も/[コメント]で教えて
