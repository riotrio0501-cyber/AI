  dark: '#06201C'
  note: 越前海岸の緑青
hook:
  narration: 福井県民なら、全部わかる。
  captions:
  - '[福井県民]なら/{全部}わかる'
facts:
- title: 眼鏡
  post: "メガネフレームの9割以上が鯖江"
  photo: assets/photos/fukui/sabae.jpg
  narration: その1。日本のメガネフレームは、ほとんどが福井の鯖江生まれ。国内生産のシェアは、9割以上。
  reading: その1。日本のメガネフレームは、ほとんどが福井のさばえ生まれ。国内生産のシェアは、9割以上。
  captions:
  - ①[メガネフレーム]は/ほぼ{鯖江}
  - 国内シェア/{9割以上}
  status: ok
  evidence:
  - url: https://ja.wikipedia.org/wiki/鯖江市
    memo: 鯖江市はメガネフレームの国内生産の9割以上を占める（鯖江市資料）。
- title: 冬の水ようかん
  post: "水ようかんは冬に食べる"
  photo:
    emoji: 🍮
  narration: その2。水ようかんは、夏じゃなくて冬に食べるもの。こたつで食べるのが、福井の冬の定番。
  reading: その2。みずようかんは、夏じゃなくて冬に食べるもの。こたつで食べるのが、福井の冬の定番。
  captions:
  - ②[水ようかん]は
  - 夏じゃなくて/{冬}
  - '{こたつ}で食べる'
  status: ok
  evidence:
  - url: https://ja.wikipedia.org/wiki/水羊羹
    memo: 福井県では冬に食べる水ようかん（丁稚羊羹系の薄い紙箱入り）が定番とされる。
- title: ソースカツ丼
  post: "カツ丼といえばソースカツ丼"
  photo: assets/photos/fukui/katsudon.jpg
  narration: その3。福井でカツ丼といえば、ソースカツ丼。卵でとじたのを頼むなら、玉子カツ丼と言わないと出てこない。
  reading: その3。福井でカツ丼といえば、ソースカツ丼。卵でとじたのを頼むなら、たまごカツ丼と言わないと出てこない。
  captions:
  - ③カツ丼といえば/[ソースカツ丼]
  - 卵とじは/{玉子カツ丼}
  status: 説
  evidence:
  - url: https://ja.wikipedia.org/wiki/ソースカツ丼
    memo: ヨーロッパ軒（福井市）が広めたとされる。店によっては卵とじを「玉子カツ丼」等と呼ぶ。「出てこない」は店による（説）。
comment_question: カツ丼はソース派？卵とじ派？
outro:
  narration: カツ丼は、ソース派？卵とじ派？あなたの県のあるあるも、コメントで教えて。
  captions:
  - カツ丼は/[ソース]派？[卵とじ]派？
  - あなたの県も/[コメント]で教えて
