prefecture: 宮城県
code: 4
color:
  main: "#3B82F6"
  dark: "#071630"
  note: "杜の都の空と海の青"

hook:
  narration: "宮城県民なら、全部わかる。"
  captions:
    - "[宮城県民]なら/{全部}わかる"

facts:
  - title: "冷やし中華は仙台発祥説"
    photo: assets/photos/miyagi/hiyashichuka.jpg
    narration: "その1。冷やし中華は、仙台が発祥という説がある。昭和12年、仙台の中華料理店が、夏でも食べやすい麺として考えた。"
    reading: "その1。冷やし中華は、仙台が発祥という説がある。昭和じゅうにねん、仙台の中華料理店が、夏でも食べやすい麺として考えた。"
    captions:
      - "①冷やし中華は/[仙台発祥]説"
      - "{昭和12年}に/仙台の中華料理店が"
      - "夏向けの麺として/考案"
    status: ok
    evidence:
      - url: https://rurubu.jp/andmore/article/14420
        memo: "仙台の中国料理店「龍亭」が1937年（昭和12年）に考案した「涼拌麺」が元祖とする説が有力。東京・神田「揚子江菜館」説もあるため、動画では「説がある」と表現。"

  - title: "せり鍋は根っこが主役"
    photo: assets/photos/miyagi/serinabe.jpg
    narration: "その2。宮城のせり鍋は、葉っぱだけじゃなく、根っこまで食べる。シャキシャキの根っこがいちばんうまい、という人も多い。"
    captions:
      - "②せり鍋は/[根っこまで]食べる"
      - "根っこが{一番うまい}/という人も"
    status: 説
    evidence:
      - url: https://www.knt.co.jp/goto/miryoku/hokkaido-tohoku/bimi001.html
        memo: "二次資料。名取市では根っこまで丸ごと食べるせり鍋が名物。宮城県はせり生産量全国1位とされる（動画では数字を出していない）。「根っこが一番うまい」は人による評価なので「という人も多い」と表現。"

  - title: "七夕は8月"
    photo: assets/photos/miyagi/tanabata.jpg
    narration: "その3。仙台の七夕は、7月じゃなくて8月。毎年8月6日から8日に、大きな七夕まつりがある。"
    captions:
      - "③仙台の七夕は"
      - "7月じゃなく[8月]"
      - "毎年{8月6日〜8日}"
    status: ok
    evidence:
      - url: https://www.sendaitanabata.com/
        memo: "仙台七夕まつり公式。旧暦に近い月遅れで毎年8月6日〜8日に開催。"

comment_question: "冷やし中華の元祖、仙台？東京？"

outro:
  narration: "冷やし中華の元祖、仙台と東京、どっちだと思う？あなたの県のあるあるも、コメントで教えて。"
  captions:
    - "冷やし中華の元祖/[仙台]？[東京]？"
    - "あなたの県も/[コメント]で教えて"
