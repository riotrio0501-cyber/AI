- title: 鳥もつ煮
  post: "甲府の鳥もつ煮はB-1グランプリ優勝"
  photo: assets/photos/yamanashi/torimotsu.jpg
  narration: その2。甲府の鳥もつ煮は、B級グルメの大会で、グランプリをとったこともある。甘辛いたれが、てりてり。
