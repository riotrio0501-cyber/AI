  - '{いくつも}入ってる人も'
  status: ok
  evidence:
  - url: https://ja.wikipedia.org/wiki/無尽
    memo: 山梨県では親睦目的の「無尽会」が今も盛んとされる。「いくつも入っている人も」は県内の声として広く紹介される（演出）。
