- title: 無尽
  post: "大人は「無尽」で忙しい"
  photo:
    emoji: 🍻
  narration: その3。山梨の大人は、無尽で忙しい。仲間でお金を積み立てて、毎月集まって飲む会。いくつも入っている人も。
  reading: その3。山梨の大人は、むじんで忙しい。仲間でお金を積み立てて、毎月集まって飲む会。いくつも入っている人も。
