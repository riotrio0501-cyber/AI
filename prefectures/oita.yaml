prefecture: 大分県
code: 44
color:
  main: "#6FB23A"
  dark: "#122007"
  note: "かぼすの緑"

hook:
  narration: "大分県民なら、全部わかる。"
  captions:
    - "[大分県民]なら/{全部}わかる"

facts:
  - title: "温泉日本一"
    photo: {emoji: "♨️"}
    narration: "その1。大分県は、温泉の源泉の数も、湧き出る量も日本一。おんせん県を名乗るのは、だてじゃない。"
    reading: "その1。大分県は、温泉の源泉の数も、わきでる量も日本一。おんせん県を名乗るのは、だてじゃない。"
    captions:
      - "①温泉の数も量も/[日本一]"
      - "{おんせん県}は/だてじゃない"
    status: ok
    evidence:
      - url: https://www.pref.oita.jp/uploaded/attachment/1023272.pdf
        memo: "大分県資料。温泉の源泉数・湧出量ともに全国1位（源泉数4,418、2位鹿児島2,753。環境省「温泉利用状況」）。"

  - title: "とり天"
    photo: {emoji: "🍤"}
    narration: "その2。大分で天ぷらといえば、とり天。鶏肉の天ぷらを、酢醤油やからしで食べる。発祥は別府という説が有力。"
    reading: "その2。大分で天ぷらといえば、とりてん。鶏肉の天ぷらを、すじょうゆやからしで食べる。発祥は別府という説が有力。"
    captions:
      - "②天ぷらといえば/[とり天]"
      - "{酢醤油}とからしで"
      - "発祥は/[別府]説"
    status: 説
    evidence:
      - url: https://gigazine.net/news/20161110-toyoken-toriten/
        memo: "二次資料。別府の「レストラン東洋軒」（大正15年創業）が発祥とされる。昭和初期の考案説など細部に諸説あるため「説」。"

  - title: "からあげは宇佐？中津？"
    photo: {emoji: "🍗"}
    narration: "その3。からあげ専門店の発祥は宇佐。でも、からあげの聖地と呼ばれるのは中津。お隣どうしの、からあげ対決。"
    reading: "その3。からあげ専門店の発祥は、うさ。でも、からあげの聖地と呼ばれるのは、なかつ。お隣どうしの、からあげ対決。"
    captions:
      - "③からあげ専門店の/発祥は[宇佐]"
      - "聖地と呼ばれるのは/[中津]"
      - "お隣どうしの/{からあげ対決}"
    status: ok
    evidence:
      - url: https://tabi-mag.jp/karaage-rairaiken/
        memo: "宇佐市の中華料理店「来々軒」に「からあげ専門店発祥の地」記念碑。調理法の公開で宇佐・中津に広まり、発祥の地・宇佐、聖地・中津という棲み分けが生まれたとされる。「対決」は演出上の表現。"

comment_question: "からあげは宇佐派？中津派？"

outro:
  narration: "からあげは、宇佐派？中津派？あなたの県のあるあるも、コメントで教えて。"
  reading: "からあげは、うさ派？なかつ派？あなたの県のあるあるも、コメントで教えて。"
  captions:
    - "からあげは/[宇佐]派？[中津]派？"
    - "あなたの県も/[コメント]で教えて"
