prefecture: 岐阜県
code: 21
color:
  main: '#D9573E'
  dark: '#230B07'
  note: 長良川の鵜飼の火
hook:
  narration: 岐阜県民なら、全部わかる。
  captions:
  - '[岐阜県民]なら/{全部}わかる'
facts:
- title: モーニング
  post: "喫茶代は名古屋より岐阜市が上の年も"
  photo: assets/photos/gifu/morning.jpg
  narration: その1。喫茶店のモーニングといえば名古屋。でも、喫茶代にお金をかけているのは、実は岐阜市、という年も多い。
  reading: その1。喫茶店のモーニングといえば名古屋。でも、きっさだいにお金をかけているのは、実は岐阜市、という年も多い。
  captions:
  - ①モーニングといえば/{名古屋}？
  - 喫茶代は実は/[岐阜市]が上位
  status: 説
  evidence:
  - url: https://www.stat.go.jp/data/kakei/
    memo: 総務省「家計調査」の喫茶代で岐阜市は全国1位の年が多い（年により名古屋市と入れ替わるため「説」）。
- title: 鶏ちゃん
  post: "郷土料理・鶏ちゃん"
  photo: assets/photos/gifu/keichan.jpg
  narration: その2。鶏ちゃんは、味つけした鶏肉を、キャベツと一緒に焼く郷土料理。家ごとに味がちがう。
  reading: その2。けいちゃんは、味つけした鶏肉を、キャベツと一緒に焼く郷土料理。家ごとに味がちがう。
  captions:
  - ②[鶏ちゃん]を/知ってる？
  - 鶏肉と{キャベツ}を/焼く
  - '{家ごと}に味がちがう'
  status: ok
  evidence:
  - url: https://ja.wikipedia.org/wiki/鶏ちゃん
    memo: 奥美濃・飛騨地方の郷土料理。味噌・醤油・塩など家庭や店ごとに味つけが異なる。
- title: 美濃と飛騨
  post: "美濃と飛騨はまるで別の県"
  photo: assets/photos/gifu/shirakawago.jpg
  narration: その3。岐阜は、南の美濃と北の飛騨で、まるで別の県。もともと別の国で、気候も言葉もちがう。
  reading: その3。岐阜は、南のみのと北のひだで、まるで別の県。もともと別の国で、気候も言葉もちがう。
  captions:
  - ③南の[美濃]と/北の[飛騨]
  - まるで{別の県}
  - '{気候}も{言葉}も/ちがう'
  status: ok
  evidence:
  - url: https://ja.wikipedia.org/wiki/岐阜県
    memo: 岐阜県は旧美濃国と旧飛騨国からなる。濃尾平野と山岳地帯で気候・方言が大きく異なる。「別の県」は演出。
comment_question: 美濃派？飛騨派？
outro:
  narration: あなたは、美濃派？飛騨派？あなたの県のあるあるも、コメントで教えて。
  reading: あなたは、みの派？ひだ派？あなたの県のあるあるも、コメントで教えて。
  captions:
  - '[美濃]派？/[飛騨]派？'
  - あなたの県も/[コメント]で教えて
