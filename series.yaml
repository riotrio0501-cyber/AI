# シリーズ共通設定（全県の動画で共通）
header: "{prefecture}民しか知らないこと3選"
fps: 30
size: [1080, 1920]
voice:                    # 県ファイルに voice: を書けば県ごとに上書きできる
  engine: sbv2            # sbv2（Style-Bert-VITS2・自然な声） / openjtalk（軽量・機械的）
  model: koharune-ami     # koharune-ami / jvnv-F1-jp / jvnv-F2-jp / jvnv-M1-jp / jvnv-M2-jp（tts_sbv2.py の VOICES）
  style: Neutral
  speed: 1.0              # 読み上げ速度（1.0が標準。大きいほど速い）
  hook_speed: 1.1         # フックは0〜1.5秒に収めたいので少し速く
gap_sec: 0.35             # シーン間の無音
highlight_color: "#FFD54A" # { } で囲んだ文字の色
bgm_volume: 0.13          # BGM音量（0〜1）。ナレーション中は自動でさらに下げる
credit: "地図出典：地球地図日本（国土地理院）"
duration_range: [30, 40]
